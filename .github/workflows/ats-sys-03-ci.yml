name: ATS-SYS-03 CI

on:
  push:
    branches:
      - agent/ats-sys-03-import-robustness-capacity
      - agent/ats-sys-03e-real-world-corpus
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build & Verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Dependency audit
        run: npm audit --audit-level=moderate

      - name: Enforce local-only AI runtime
        run: |
          if grep -R -n -E 'Gemini|GoogleGenAI|@google/genai|GEMINI_API_KEY' \
            app lib components package.json package-lock.json .env.example; then
            echo 'Remote Gemini runtime residue detected.' >&2
            exit 1
          fi

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Behavior tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Verify PDF.js server runtime bundle
        run: node scripts/verify-pdfjs-server-bundle.mjs

      - name: Validate Docker Compose topology
        run: docker compose config --quiet

      - name: Build identified CV Engine Docker image
        run: |
          docker build \
            --build-arg CVENGINE_BUILD_SHA="$GITHUB_SHA" \
            --build-arg CVENGINE_ARCHITECTURE_VERSION="ats-sys-01-v0.1" \
            --tag cv-engine-ci .

      - name: Verify Docker build identity
        run: |
          docker image inspect cv-engine-ci --format '{{range .Config.Env}}{{println .}}{{end}}' > /tmp/cv-engine-image-env.txt
          grep -Fx "CVENGINE_BUILD_SHA=$GITHUB_SHA" /tmp/cv-engine-image-env.txt
          grep -Fx 'CVENGINE_ARCHITECTURE_VERSION=ats-sys-01-v0.1' /tmp/cv-engine-image-env.txt

      - name: Install browser acceptance runtime
        run: |
          mkdir -p /tmp/cv-engine-playwright
          npm install --prefix /tmp/cv-engine-playwright --package-lock=false --ignore-scripts playwright@1.62.0
          /tmp/cv-engine-playwright/node_modules/.bin/playwright install chromium --with-deps

      - name: Start browser acceptance server
        run: |
          npm run dev > /tmp/cv-engine-e2e.log 2>&1 &
          echo $! > /tmp/cv-engine-e2e.pid
          for attempt in {1..60}; do
            if curl --fail --silent http://localhost:3000/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/cv-engine-e2e.log
          exit 1

      - name: Browser acceptance
        env:
          CV_ENGINE_E2E_BASE_URL: http://localhost:3000
          CV_ENGINE_PLAYWRIGHT_MODULE: file:///tmp/cv-engine-playwright/node_modules/playwright/index.mjs
        run: |
          node scripts/release-browser-acceptance.mjs
          node scripts/release-browser-editor-controls.mjs
          node scripts/release-browser-terminal-surfaces.mjs
          node scripts/release-browser-market-surfaces.mjs

      - name: Stop browser acceptance server
        if: always()
        run: |
          if [ -f /tmp/cv-engine-e2e.pid ]; then
            kill "$(cat /tmp/cv-engine-e2e.pid)" || true
          fi
          if [ -f /tmp/cv-engine-e2e.log ]; then
            tail -n 200 /tmp/cv-engine-e2e.log
          fi
