name: Fix ATS-AI-04 sanitizer imports

on:
  push:
    branches:
      - agent/ats-ai-04-local-intelligence-runtime

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/ats-ai-04-local-intelligence-runtime

      - name: Replace obsolete AI-facade sanitizer imports
        run: |
          files=(
            app/api/assess-opportunity/route.ts
            app/api/assess-market-opportunity/route.ts
            app/api/market-candidate-analysis/route.ts
          )
          for file in "${files[@]}"; do
            sed -i "s|from '@/lib/gemini'|from '@/lib/application/resume/ResumeInputSanitizer'|g" "$file"
          done
          if grep -R "@/lib/gemini" app lib --include='*.ts' --include='*.tsx'; then
            echo "Obsolete runtime import remains" >&2
            exit 1
          fi

      - name: Commit model-independent sanitizer migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            app/api/assess-opportunity/route.ts \
            app/api/assess-market-opportunity/route.ts \
            app/api/market-candidate-analysis/route.ts
          if git diff --cached --quiet; then
            echo "No sanitizer migration required"
            exit 0
          fi
          git commit -m "ATS-AI-04: remove remaining Gemini facade imports"
          git push origin HEAD:agent/ats-ai-04-local-intelligence-runtime
