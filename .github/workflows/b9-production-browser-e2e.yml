name: CV Engine B9 Production Browser E2E

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: b9-production-browser-${{ github.ref }}
  cancel-in-progress: false

jobs:
  production-browser-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CVENGINE_BASE_URL: https://harvard-ats-resume.vercel.app
      CVENGINE_EXPECTED_SHA: ${{ github.sha }}
      CVENGINE_E2E_OUTPUT_DIR: artifacts/b9-production-browser
    steps:
      - name: Checkout exact release candidate
        uses: actions/checkout@v7

      - name: Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install pinned browser harness
        run: |
          python -m pip install --disable-pip-version-check playwright==1.55.0
          python -m playwright install --with-deps chromium

      - name: Certify exact Production upload-to-artifact path
        run: python tests/b9/production-browser-e2e.py

      - name: Upload sanitized browser receipt
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: cvengine-b9-production-browser-${{ github.run_id }}
          path: artifacts/b9-production-browser
          if-no-files-found: error
          retention-days: 14
