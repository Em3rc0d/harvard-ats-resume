name: CV Engine B9 Production Browser E2E

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: b9-production-browser-${{ github.ref }}
  cancel-in-progress: false

jobs:
  production-browser-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CVENGINE_BASE_URL: https://harvard-ats-resume.vercel.app
      CVENGINE_EXPECTED_SHA: ${{ github.sha }}
      CVENGINE_E2E_OUTPUT_DIR: artifacts/b9-production-browser
      CVENGINE_SYNTHETIC_EMAIL: cvengine-b9-browser-cert@invalid.example
      CVENGINE_SYNTHETIC_PASSWORD: B9-Disposable-Browser-Cert-A1!
    steps:
      - name: Checkout exact release candidate
        uses: actions/checkout@v7

      - name: Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install pinned browser harness
        run: |
          python -m pip install --disable-pip-version-check playwright==1.55.0
          python -m playwright install --with-deps chromium

      - name: Certify exact Production upload-to-artifact path
        run: |
          python - <<'PY'
          import os
          import runpy
          from pathlib import Path

          source_path = Path("tests/b9/production-browser-e2e.py")
          source = source_path.read_text(encoding="utf-8")
          signup = '''            page.get_by_role("button", name="Create an account").click()
            page.get_by_label("Email", exact=True).fill(SYNTHETIC_EMAIL)
            page.get_by_label("Password", exact=True).fill(SYNTHETIC_PASSWORD)
            page.get_by_role("button", name="Create account", exact=True).click()
'''
          signin = '''            page.get_by_label("Email", exact=True).fill(SYNTHETIC_EMAIL)
            page.get_by_label("Password", exact=True).fill(SYNTHETIC_PASSWORD)
            page.get_by_role("button", name="Sign in", exact=True).click()
'''
          if source.count(signup) != 1:
              raise SystemExit("B9_BROWSER_AUTH_PATCH_SOURCE_MISMATCH")

          patched_path = Path("artifacts/b9-production-browser/patched-production-browser-e2e.py")
          patched_path.parent.mkdir(parents=True, exist_ok=True)
          patched_path.write_text(source.replace(signup, signin, 1), encoding="utf-8")

          harness = runpy.run_path(str(patched_path), run_name="cvengine_b9_browser")
          harness["SYNTHETIC_EMAIL"] = os.environ["CVENGINE_SYNTHETIC_EMAIL"]
          harness["SYNTHETIC_PASSWORD"] = os.environ["CVENGINE_SYNTHETIC_PASSWORD"]
          raise SystemExit(harness["main"]())
          PY

      - name: Upload sanitized browser receipt
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: cvengine-b9-production-browser-${{ github.run_id }}
          path: artifacts/b9-production-browser
          if-no-files-found: error
          retention-days: 14
