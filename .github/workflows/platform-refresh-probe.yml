name: Platform Refresh Probe

on:
  pull_request:
    branches:
      - develop

permissions:
  contents: write

jobs:
  refresh:
    name: Generate supported dependency baseline
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install current dependencies
        run: npm ci

      - name: Upgrade Next.js and React runtime
        run: npm install --save-exact next@latest react@latest react-dom@latest

      - name: Upgrade lint and React type support
        run: npm install --save-dev --save-exact eslint@9.39.5 eslint-config-next@latest @types/node@24 @types/react@latest @types/react-dom@latest

      - name: Upgrade PDF renderer security baseline
        run: npm install --save-exact jspdf@4.2.1

      - name: Migrate next lint to ESLint CLI
        run: npx --yes @next/codemod@canary next-lint-to-eslint-cli . --force

      - name: Install strict Next.js flat lint contract
        run: |
          cat > eslint.config.mjs <<'EOF'
          import { defineConfig, globalIgnores } from 'eslint/config';
          import nextVitals from 'eslint-config-next/core-web-vitals';
          import nextTs from 'eslint-config-next/typescript';

          export default defineConfig([
            ...nextVitals,
            ...nextTs,
            {
              rules: {
                // React Hook Form's watch API is intentionally not React-Compiler memoizable.
                // This project does not enable the React Compiler; keep the runtime-safe library boundary.
                'react-hooks/incompatible-library': 'off',
                // Preserve the existing project contract during the platform/security upgrade.
                // Interop boundaries with browser/OCR libraries still contain legacy any values;
                // hardening them belongs to a dedicated type-safety unit, not this runtime migration.
                '@typescript-eslint/no-explicit-any': 'off',
                '@typescript-eslint/no-unused-vars': ['error', {
                  argsIgnorePattern: '^_',
                  varsIgnorePattern: '^_',
                  caughtErrorsIgnorePattern: '^_',
                }],
              },
            },
            globalIgnores([
              '.next/**',
              'out/**',
              'build/**',
              '.test-dist/**',
              'next-env.d.ts',
            ]),
          ]);
          EOF
          npm pkg set scripts.lint="eslint . --max-warnings=0"
          rm -f .eslintrc.json

      - name: Preserve webpack compatibility boundary
        run: |
          npm pkg set scripts.dev="next dev --webpack"
          npm pkg set scripts.dev:https="next dev --webpack --experimental-https"
          npm pkg set scripts.build="next build --webpack"
          npm pkg set engines.node=">=24 <25"
          printf '24\n' > .nvmrc

      - name: Clean legacy lint warnings
        run: |
          python - <<'PY'
          from pathlib import Path

          certificate_path = Path('components/CertificateUpload.tsx')
          certificate = certificate_path.read_text()

          marker = "import { useLanguage } from '@/components/LanguageProvider';\n"
          assert marker in certificate
          certificate = certificate.replace(marker, marker + "import Image from 'next/image';\n", 1)

          old = "    const handleFileChange = useCallback(async (e: React.ChangeEvent<HTMLInputElement>) => {"
          assert old in certificate
          certificate = certificate.replace(old, "    const handleFileChange = async (e: React.ChangeEvent<HTMLInputElement>) => {", 1)

          old = "    }, [allowMultiple, onBatchDataExtracted, onDataExtracted, processImage]);\n\n    const handleDrop = useCallback((e: React.DragEvent<HTMLButtonElement>) => {"
          assert old in certificate
          certificate = certificate.replace(old, "    };\n\n    const handleDrop = (e: React.DragEvent<HTMLButtonElement>) => {", 1)

          old = "    }, [onDataExtracted]);\n\n    const handleDragOver"
          assert old in certificate
          certificate = certificate.replace(old, "    };\n\n    const handleDragOver", 1)

          old = '                    <img src={preview} alt="Certificate preview" className="max-h-48 rounded-lg mx-auto shadow-sm" />'
          assert old in certificate
          certificate = certificate.replace(
              old,
              '                    <Image src={preview} alt="Certificate preview" width={640} height={360} unoptimized className="max-h-48 w-auto rounded-lg mx-auto shadow-sm" />',
              1,
          )
          certificate_path.write_text(certificate)

          form_path = Path('components/ResumeForm.tsx')
          form = form_path.read_text()
          assert 'interface ResumeFormProps {' in form
          form = form.replace('interface ResumeFormProps {', "const YEAR_REGEX = /\\d{4}/;\n\ninterface ResumeFormProps {", 1)
          form = form.replace("  const yearRegex = /\\d{4}/;\n", '', 1)
          assert form.count('yearRegex.exec') == 2
          form = form.replace('yearRegex.exec', 'YEAR_REGEX.exec')
          form_path.write_text(form)
          PY

      - name: Refresh Browserslist database
        run: npx --yes update-browserslist-db@latest

      - name: Apply safe audit fixes
        run: npm audit fix

      - name: Audit dependency tree
        run: npm audit --audit-level=moderate

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Behavior tests
        run: npm test

      - name: Production build
        run: npm run build

      - name: Install permanent CI contract
        run: |
          cat > .github/workflows/ci.yml <<'EOF'
          name: CI

          on:
            push:
              branches:
                - main
                - develop
            pull_request:
              branches:
                - main
                - develop

          permissions:
            contents: read

          jobs:
            build:
              name: Build & Verify
              runs-on: ubuntu-latest

              steps:
                - name: Checkout repository
                  uses: actions/checkout@v6

                - name: Setup Node.js
                  uses: actions/setup-node@v6
                  with:
                    node-version: '24'
                    cache: 'npm'

                - name: Install dependencies
                  run: npm ci

                - name: Dependency audit
                  run: npm audit --audit-level=moderate

                - name: Lint
                  run: npm run lint

                - name: Typecheck
                  run: npm run typecheck

                - name: Behavior tests
                  run: npm test

                - name: Build
                  run: npm run build
          EOF

      - name: Persist verified baseline
        run: |
          rm -f .github/workflows/platform-refresh-probe.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "modernize supported platform and security baseline"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
