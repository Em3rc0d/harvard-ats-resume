name: CV Engine B9 Supabase Secret Presence

on:
  push:
    branches:
      - certification/b9-supabase-secret-presence
  workflow_dispatch:

permissions:
  contents: read

jobs:
  presence:
    runs-on: ubuntu-latest
    steps:
      - name: Report secret presence only
        env:
          SUPABASE_ACCESS_TOKEN_VALUE: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_SERVICE_ROLE_KEY_VALUE: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_SECRET_KEY_VALUE: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_DB_PASSWORD_VALUE: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          python - <<'PY'
          import json, os
          keys = [
              "SUPABASE_ACCESS_TOKEN_VALUE",
              "SUPABASE_SERVICE_ROLE_KEY_VALUE",
              "SUPABASE_SECRET_KEY_VALUE",
              "SUPABASE_DB_PASSWORD_VALUE",
          ]
          print(json.dumps({key.removesuffix("_VALUE"): bool(os.environ.get(key)) for key in keys}, sort_keys=True))
          PY
