name: Verify ATS-AI-04 local runtime

on:
  push:
    branches:
      - agent/ats-ai-04-local-intelligence-runtime

concurrency:
  group: ats-ai-04-local-runtime
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - id: checkout
        name: Checkout feature branch
        uses: actions/checkout@v6
        with:
          ref: agent/ats-ai-04-local-intelligence-runtime

      - id: node
        name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - id: npm_ci
        name: Install exact dependency graph
        run: npm ci

      - id: audit
        name: Dependency audit
        run: npm audit --audit-level=moderate

      - id: local_only
        name: Enforce local-only AI runtime
        run: |
          if grep -R -n -E 'Gemini|GoogleGenAI|@google/genai|GEMINI_API_KEY' \
            app lib components package.json package-lock.json .env.example; then
            echo 'Remote Gemini runtime residue detected.' >&2
            exit 1
          fi

      - id: lint
        name: Lint
        run: npm run lint

      - id: typecheck
        name: Typecheck
        run: npm run typecheck

      - id: behavior
        name: Behavior tests
        run: npm test

      - id: build
        name: Production build
        run: npm run build

      - id: pdfjs
        name: Verify PDF.js server bundle
        run: node scripts/verify-pdfjs-server-bundle.mjs

      - id: compose
        name: Validate Docker Compose topology
        run: docker compose config --quiet

      - id: docker_build
        name: Build CV Engine application image
        run: docker build --tag cv-engine-ats-ai-04 .

      - id: playwright_install
        name: Install browser acceptance runtime
        run: |
          mkdir -p /tmp/cv-engine-playwright
          npm install --prefix /tmp/cv-engine-playwright --package-lock=false --ignore-scripts playwright@1.62.0
          /tmp/cv-engine-playwright/node_modules/.bin/playwright install chromium --with-deps

      - id: browser_server
        name: Start browser acceptance server
        run: |
          npm run dev > /tmp/cv-engine-e2e.log 2>&1 &
          echo $! > /tmp/cv-engine-e2e.pid
          for attempt in {1..60}; do
            if curl --fail --silent http://localhost:3000/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/cv-engine-e2e.log
          exit 1

      - id: browser
        name: Browser acceptance
        env:
          CV_ENGINE_E2E_BASE_URL: http://localhost:3000
          CV_ENGINE_PLAYWRIGHT_MODULE: file:///tmp/cv-engine-playwright/node_modules/playwright/index.mjs
        run: |
          node scripts/release-browser-acceptance.mjs
          node scripts/release-browser-editor-controls.mjs
          node scripts/release-browser-terminal-surfaces.mjs
          node scripts/release-browser-market-surfaces.mjs

      - name: Stop browser acceptance server
        if: always()
        run: |
          if [ -f /tmp/cv-engine-e2e.pid ]; then
            kill "$(cat /tmp/cv-engine-e2e.pid)" || true
          fi
          if [ -f /tmp/cv-engine-e2e.log ]; then
            tail -n 120 /tmp/cv-engine-e2e.log
          fi

      - name: Record verification receipt
        if: always() && steps.checkout.outcome == 'success'
        env:
          NPM_CI: ${{ steps.npm_ci.outcome }}
          AUDIT: ${{ steps.audit.outcome }}
          LOCAL_ONLY: ${{ steps.local_only.outcome }}
          LINT: ${{ steps.lint.outcome }}
          TYPECHECK: ${{ steps.typecheck.outcome }}
          BEHAVIOR: ${{ steps.behavior.outcome }}
          BUILD: ${{ steps.build.outcome }}
          PDFJS: ${{ steps.pdfjs.outcome }}
          COMPOSE: ${{ steps.compose.outcome }}
          DOCKER_BUILD: ${{ steps.docker_build.outcome }}
          PLAYWRIGHT_INSTALL: ${{ steps.playwright_install.outcome }}
          BROWSER_SERVER: ${{ steps.browser_server.outcome }}
          BROWSER: ${{ steps.browser.outcome }}
        run: |
          RESULT=PASS
          for value in "$NPM_CI" "$AUDIT" "$LOCAL_ONLY" "$LINT" "$TYPECHECK" "$BEHAVIOR" "$BUILD" "$PDFJS" "$COMPOSE" "$DOCKER_BUILD" "$PLAYWRIGHT_INSTALL" "$BROWSER_SERVER" "$BROWSER"; do
            if [ "$value" != "success" ]; then RESULT=FAIL; fi
          done

          mkdir -p evidence
          cat > evidence/ATS-AI-04-VERIFICATION.md <<EOF
          # ATS-AI-04 Verification

          - Source commit: ${GITHUB_SHA}
          - Workflow run: ${GITHUB_RUN_ID}
          - Result: ${RESULT}
          - npm ci: ${NPM_CI}
          - dependency audit: ${AUDIT}
          - local-only AI invariant: ${LOCAL_ONLY}
          - lint: ${LINT}
          - typecheck: ${TYPECHECK}
          - behavior tests: ${BEHAVIOR}
          - production build: ${BUILD}
          - PDF.js bundle verification: ${PDFJS}
          - docker compose config: ${COMPOSE}
          - Docker application image build: ${DOCKER_BUILD}
          - Playwright install: ${PLAYWRIGHT_INSTALL}
          - browser server: ${BROWSER_SERVER}
          - Chromium acceptance: ${BROWSER}

          This receipt verifies the application/runtime topology for the source commit above. CI intentionally does not download qwen3:8b; real-model quality remains a local dogfood gate.
          EOF

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- evidence/ATS-AI-04-VERIFICATION.md
          git commit -m "ATS-AI-04: record clean-room verification (${RESULT})"
          git push origin HEAD:agent/ats-ai-04-local-intelligence-runtime

          if [ "$RESULT" != "PASS" ]; then exit 1; fi
