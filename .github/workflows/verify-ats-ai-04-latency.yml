name: Verify ATS-AI-04 latency policy

on:
  push:
    branches:
      - agent/ats-ai-04-local-intelligence-runtime
    paths-ignore:
      - evidence/ATS-AI-04-LATENCY-VERIFICATION.md

concurrency:
  group: ats-ai-04-latency-verification
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - id: checkout
        uses: actions/checkout@v6
        with:
          ref: agent/ats-ai-04-local-intelligence-runtime

      - id: npm_ci
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - id: install
        name: npm ci
        run: npm ci

      - id: audit
        name: dependency audit
        run: npm audit --audit-level=moderate

      - id: lint
        name: lint
        run: npm run lint

      - id: typecheck
        name: typecheck
        run: npm run typecheck

      - id: behavior
        name: behavior tests
        run: npm test

      - id: build
        name: production build
        run: npm run build

      - id: pdfjs
        name: PDF.js bundle verification
        run: node scripts/verify-pdfjs-server-bundle.mjs

      - id: compose
        name: Docker Compose validation
        run: docker compose config --quiet

      - id: docker_build
        name: Docker application image build
        run: docker build --tag cv-engine-ats-ai-04-latency .

      - name: Record verification receipt
        if: always() && steps.checkout.outcome == 'success'
        env:
          INSTALL: ${{ steps.install.outcome }}
          AUDIT: ${{ steps.audit.outcome }}
          LINT: ${{ steps.lint.outcome }}
          TYPECHECK: ${{ steps.typecheck.outcome }}
          BEHAVIOR: ${{ steps.behavior.outcome }}
          BUILD: ${{ steps.build.outcome }}
          PDFJS: ${{ steps.pdfjs.outcome }}
          COMPOSE: ${{ steps.compose.outcome }}
          DOCKER_BUILD: ${{ steps.docker_build.outcome }}
        run: |
          RESULT=PASS
          for value in "$INSTALL" "$AUDIT" "$LINT" "$TYPECHECK" "$BEHAVIOR" "$BUILD" "$PDFJS" "$COMPOSE" "$DOCKER_BUILD"; do
            if [ "$value" != "success" ]; then RESULT=FAIL; fi
          done
          mkdir -p evidence
          cat > evidence/ATS-AI-04-LATENCY-VERIFICATION.md <<EOF
          # ATS-AI-04 Local Inference Latency Verification

          - Source commit: ${GITHUB_SHA}
          - Workflow run: ${GITHUB_RUN_ID}
          - Result: ${RESULT}
          - npm ci: ${INSTALL}
          - dependency audit: ${AUDIT}
          - lint: ${LINT}
          - typecheck: ${TYPECHECK}
          - behavior tests: ${BEHAVIOR}
          - production build: ${BUILD}
          - PDF.js bundle verification: ${PDFJS}
          - Docker Compose validation: ${COMPOSE}
          - Docker application image build: ${DOCKER_BUILD}

          This receipt verifies the bounded workload-model policy and Docker topology. Real local-model throughput remains a hardware-specific dogfood measurement and is reported by runtime inference telemetry.
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- evidence/ATS-AI-04-LATENCY-VERIFICATION.md
          git commit -m "ATS-AI-04: record latency-policy verification (${RESULT})"
          git push origin HEAD:agent/ats-ai-04-local-intelligence-runtime
          if [ "$RESULT" != "PASS" ]; then exit 1; fi