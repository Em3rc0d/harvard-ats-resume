name: CV Engine Production Browser Certification

on:
  push:
    branches:
      - certification/e2e-a44ec836
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production-browser-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CERT_ARTIFACT_DIR: artifacts/production-certification
      CERT_HARNESS_REVISION: "7-diagnostic-pre-delete"
    steps:
      - name: Checkout certification branch
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Build minimal DOCX import fixture
        run: |
          python3 - <<'PY'
          import zipfile
          from pathlib import Path
          out = Path('/tmp/cvengine-cert.docx')
          content_types = '''<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
          <Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">
            <Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>
            <Default Extension="xml" ContentType="application/xml"/>
            <Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/>
          </Types>'''
          rels = '''<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
          <Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">
            <Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/>
          </Relationships>'''
          document = '''<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
          <w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"><w:body>
            <w:p><w:r><w:t>CV Engine certification resume</w:t></w:r></w:p>
            <w:p><w:r><w:t>Built a TypeScript and PostgreSQL service with Docker deployment.</w:t></w:r></w:p>
            <w:sectPr/>
          </w:body></w:document>'''
          with zipfile.ZipFile(out, 'w', zipfile.ZIP_DEFLATED) as z:
              z.writestr('[Content_Types].xml', content_types)
              z.writestr('_rels/.rels', rels)
              z.writestr('word/document.xml', document)
          print(out)
          PY

      - name: Normalize functional browser waits and selectors
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tests/e2e/production-certification.mjs')
          text = path.read_text()
          old_select = "selectOption({ label: /Backend Engineer/ })"
          old_reload = "page.reload({ waitUntil: 'networkidle' })"
          assert text.count(old_select) == 2, 'Expected exactly two deterministic Job Snapshot selectors'
          assert text.count(old_reload) == 1, 'Expected exactly one returning-user reload wait'
          text = text.replace(old_select, "selectOption({ index: 1 })")
          text = text.replace(old_reload, "page.reload({ waitUntil: 'domcontentloaded', timeout: 30000 })")
          path.write_text(text)
          PY

      - name: Instrument pre-delete 5xx boundary
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tests/e2e/production-certification.mjs')
          text = path.read_text()
          text = text.replace(
              "const CORE_EMAIL = 'cvengine-cert-a44ec836@invalid.example';",
              "const CORE_EMAIL = 'cvengine-cert-ai-a44ec836@invalid.example';",
          )
          text = text.replace(
              "const CORE_PASSWORD = 'CVEngine-Cert-a44ec836-2026!';",
              "const CORE_PASSWORD = 'CVEngine-Cert-AI-a44ec836-2026!';",
          )
          needle = "fiveHundreds.push(`${response.status()} ${response.request().method()} ${response.url()}`);"
          replacement = """const line = `${response.status()} ${response.request().method()} ${response.url()}`;
      fiveHundreds.push(line);
      void response.text().then((body) => console.error(`CVENGINE_5XX ${new Date().toISOString()} ${line} body=${body}`)).catch((error) => console.error(`CVENGINE_5XX_BODY_READ_FAILED ${line} ${String(error)}`));"""
          assert needle in text, '5xx guard instrumentation anchor missing'
          text = text.replace(needle, replacement)
          delete_call = "    await exportAndDeleteAccount(page, 'core-account-export.json');"
          assert delete_call in text, 'core delete anchor missing'
          text = text.replace(delete_call, "    await screenshot(page, '04b-pre-delete-boundary');\n    await page.waitForTimeout(1000);")
          platform_call = "  await platformGemini(browser);"
          assert platform_call in text, 'platform phase anchor missing'
          text = text.replace(platform_call, "  console.log('CVENGINE_DIAGNOSTIC_PRE_DELETE_COMPLETE=YES');")
          path.write_text(text)
          PY

      - name: Execute pre-delete diagnostic journey
        run: node tests/e2e/production-certification.mjs

      - name: Upload certification receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cvengine-production-certification-${{ github.run_id }}
          path: artifacts/production-certification
          if-no-files-found: warn
          retention-days: 1
