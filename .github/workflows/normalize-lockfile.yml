name: Normalize ATS-AI-04 lockfile

on:
  push:
    branches:
      - agent/ats-ai-04-local-intelligence-runtime
  workflow_dispatch:

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v6
        with:
          ref: agent/ats-ai-04-local-intelligence-runtime

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Regenerate package lock
        run: npm install --package-lock-only --ignore-scripts

      - name: Commit normalized lockfile when changed
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json already normalized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- package-lock.json
          git commit -m "ATS-AI-04: normalize package lock after Gemini removal"
          git push origin HEAD:agent/ats-ai-04-local-intelligence-runtime
