name: Temporary Supabase DNS Probe

on:
  push:
    branches: [fix/auth-upstream-resilience]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Probe public Supabase endpoints
        shell: bash
        run: |
          set -u
          for host in zqcwlnshtsectitagkca.supabase.co mcpygkebzetgzauelgjf.supabase.co; do
            echo "=== ${host} ==="
            python - "$host" <<'PY'
          import socket, sys
          host = sys.argv[1]
          try:
              addrs = sorted({row[4][0] for row in socket.getaddrinfo(host, 443, type=socket.SOCK_STREAM)})
              print("DNS_OK", ",".join(addrs))
          except Exception as exc:
              print("DNS_FAIL", type(exc).__name__, str(exc))
          PY
            code="$(curl --connect-timeout 5 --max-time 10 -sS -o /dev/null -w '%{http_code}' "https://${host}/auth/v1/health" 2>curl.err || true)"
            echo "HTTPS_STATUS ${code:-000}"
            if [ -s curl.err ]; then sed 's/^/CURL_ERROR /' curl.err; fi
            rm -f curl.err
          done
