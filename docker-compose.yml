name: cv-engine

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis-http:
    image: hiett/serverless-redis-http:latest
    restart: unless-stopped
    environment:
      SRH_MODE: env
      SRH_TOKEN: ${LOCAL_REDIS_TOKEN:-cv-engine-local-change-me}
      SRH_CONNECTION_STRING: redis://redis:6379
    ports:
      - "8079:80"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://127.0.0.1:80 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20

  ollama:
    image: ollama/ollama:0.32.6
    restart: unless-stopped
    environment:
      # Keep memory behavior predictable on developer machines. CV Engine swaps
      # workload models instead of trying to retain several local LLMs at once.
      OLLAMA_MAX_LOADED_MODELS: ${OLLAMA_MAX_LOADED_MODELS:-1}
      OLLAMA_NUM_PARALLEL: ${OLLAMA_NUM_PARALLEL:-1}
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 10s

  ollama-init:
    image: ollama/ollama:0.32.6
    restart: "no"
    environment:
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3:8b}
      # Docker import v3 deliberately ignores the legacy OLLAMA_IMPORT_MODEL
      # variable so an old qwen3:8b setting cannot resurrect the monolithic
      # importer. Override only with DOCKER_OLLAMA_IMPORT_MODEL when testing.
      OLLAMA_IMPORT_MODEL: ${DOCKER_OLLAMA_IMPORT_MODEL:-qwen3:1.7b}
      OLLAMA_RESUME_MODEL: ${OLLAMA_RESUME_MODEL:-qwen3:8b}
      OLLAMA_OPTIMIZE_MODEL: ${OLLAMA_OPTIMIZE_MODEL:-qwen3:4b-instruct}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        seen=""
        for model in "$${OLLAMA_MODEL}" "$${OLLAMA_IMPORT_MODEL}" "$${OLLAMA_RESUME_MODEL}" "$${OLLAMA_OPTIMIZE_MODEL}"; do
          case "|$${seen}|" in
            *"|$${model}|"*) continue ;;
          esac
          echo "Ensuring local model $${model} is installed..."
          ollama pull "$${model}"
          seen="$${seen}|$${model}"
        done
        echo "Preloading import model $${OLLAMA_IMPORT_MODEL}..."
        ollama run "$${OLLAMA_IMPORT_MODEL}" ""
    depends_on:
      ollama:
        condition: service_healthy

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3:8b}
      OLLAMA_IMPORT_MODEL: ${DOCKER_OLLAMA_IMPORT_MODEL:-qwen3:1.7b}
      OLLAMA_RESUME_MODEL: ${OLLAMA_RESUME_MODEL:-qwen3:8b}
      OLLAMA_OPTIMIZE_MODEL: ${OLLAMA_OPTIMIZE_MODEL:-qwen3:4b-instruct}
      OLLAMA_NUM_CTX: ${OLLAMA_NUM_CTX:-16384}
      # Import v3 caps each bounded section request at 90 seconds internally.
      # This value remains the outer compatibility budget used by the importer.
      RESUME_IMPORT_TIMEOUT_MS: ${DOCKER_RESUME_IMPORT_TIMEOUT_MS:-180000}
      RESUME_GENERATION_TIMEOUT_MS: ${DOCKER_RESUME_GENERATION_TIMEOUT_MS:-240000}
      RATE_LIMIT_BACKEND: redis
      UPSTASH_REDIS_REST_URL: http://redis-http:80
      UPSTASH_REDIS_REST_TOKEN: ${LOCAL_REDIS_TOKEN:-cv-engine-local-change-me}
    depends_on:
      ollama-init:
        condition: service_completed_successfully
      redis-http:
        condition: service_healthy

volumes:
  ollama-data:
  redis-data:
