name: cv-engine

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis-http:
    image: hiett/serverless-redis-http:latest
    restart: unless-stopped
    environment:
      SRH_MODE: env
      SRH_TOKEN: ${LOCAL_REDIS_TOKEN:-cv-engine-local-change-me}
      SRH_CONNECTION_STRING: redis://redis:6379
    ports:
      - "8079:80"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://127.0.0.1:80 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20

  ollama:
    image: ollama/ollama:0.32.6
    restart: unless-stopped
    environment:
      OLLAMA_MAX_LOADED_MODELS: ${OLLAMA_MAX_LOADED_MODELS:-1}
      OLLAMA_NUM_PARALLEL: ${OLLAMA_NUM_PARALLEL:-1}
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 10s

  ollama-init:
    image: ollama/ollama:0.32.6
    restart: "no"
    environment:
      OLLAMA_HOST: http://ollama:11434
      # Generic local default stays small. Final resume assembly is deterministic
      # and therefore does not require a whole-resume model.
      OLLAMA_MODEL: ${DOCKER_OLLAMA_MODEL:-qwen3:1.7b}
      OLLAMA_IMPORT_MODEL: ${DOCKER_OLLAMA_IMPORT_MODEL:-qwen3:1.7b}
      OLLAMA_OPTIMIZE_MODEL: ${DOCKER_OLLAMA_OPTIMIZE_MODEL:-qwen3:4b-instruct}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        seen=""
        for model in "$${OLLAMA_MODEL}" "$${OLLAMA_IMPORT_MODEL}" "$${OLLAMA_OPTIMIZE_MODEL}"; do
          case "|$${seen}|" in
            *"|$${model}|"*) continue ;;
          esac
          echo "Ensuring local model $${model} is installed..."
          ollama pull "$${model}"
          seen="$${seen}|$${model}"
        done
        echo "Preloading import model $${OLLAMA_IMPORT_MODEL}..."
        ollama run "$${OLLAMA_IMPORT_MODEL}" ""
    depends_on:
      ollama:
        condition: service_healthy

  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        CVENGINE_BUILD_SHA: ${CVENGINE_BUILD_SHA:-UNIDENTIFIED}
        CVENGINE_ARCHITECTURE_VERSION: ${CVENGINE_ARCHITECTURE_VERSION:-ats-sys-01-v0.1}
    restart: unless-stopped
    ports:
      # Normal local product use remains on 3000. ATS-SYS-02 overrides
      # CVENGINE_APP_PORT so reference characterization cannot share the UI port.
      - "127.0.0.1:${CVENGINE_APP_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      CVENGINE_RUNTIME_PROFILE_ID: ${CVENGINE_RUNTIME_PROFILE_ID:-UNCHARACTERIZED}
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: ${DOCKER_OLLAMA_MODEL:-qwen3:1.7b}
      OLLAMA_IMPORT_MODEL: ${DOCKER_OLLAMA_IMPORT_MODEL:-qwen3:1.7b}
      OLLAMA_OPTIMIZE_MODEL: ${DOCKER_OLLAMA_OPTIMIZE_MODEL:-qwen3:4b-instruct}
      # Docker owns a smaller bounded context so stale host settings cannot
      # recreate the 16K KV-cache memory pressure seen with the former 8B path.
      OLLAMA_NUM_CTX: ${DOCKER_OLLAMA_NUM_CTX:-8192}
      RESUME_IMPORT_TIMEOUT_MS: ${DOCKER_RESUME_IMPORT_TIMEOUT_MS:-180000}
      RATE_LIMIT_BACKEND: redis
      UPSTASH_REDIS_REST_URL: http://redis-http:80
      UPSTASH_REDIS_REST_TOKEN: ${LOCAL_REDIS_TOKEN:-cv-engine-local-change-me}
    depends_on:
      ollama-init:
        condition: service_completed_successfully
      redis-http:
        condition: service_healthy

volumes:
  ollama-data:
  redis-data:
